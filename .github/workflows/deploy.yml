name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # อนุญาตให้กด Run workflow เองได้จากแท็บ Actions
  workflow_dispatch:

# สิทธิ์ที่จำเป็นสำหรับการ deploy ขึ้น GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละครั้ง ไม่ยกเลิกงานที่กำลังรันอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js static export)
        # base_path จะเป็น "" เมื่อ deploy ที่ https://<username>.github.io/
        # และเป็น "/<repo-name>" เมื่อ deploy ที่ https://<username>.github.io/<repo-name>/
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
